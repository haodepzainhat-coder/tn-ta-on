:root{--ink:#173d39;--muted:#60736f;--green:#166953;--light:#e6f2eb;--paper:#fffef9;--line:#dce5de;--orange:#ab4b24}*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:var(--ink);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 16px;background:white;color:var(--ink);font-weight:600}button:hover{border-color:var(--green);background:#f0f7f2}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #e1a34b;outline-offset:3px}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#0f513f;color:white}.quiet{background:transparent}.danger{color:#ac352a}header{background:#123f37;color:white;padding:22px max(24px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:21px;font-weight:750;letter-spacing:-.5px}.brand small{display:block;font-size:11px;letter-spacing:2px;color:#b8d7c6}.badge{font-size:12px;border:1px solid #6b998a;padding:5px 12px;border-radius:30px}nav{display:flex;gap:8px;flex-wrap:wrap;max-width:1180px;margin:22px auto;padding:0 24px}nav button{border:0;background:transparent}nav button.active{background:var(--ink);color:white}main{max-width:1180px;margin:auto;padding:0 24px 60px}h1{font-size:clamp(28px,4vw,44px);line-height:1.2;letter-spacing:-1.4px;margin:12px 0 18px}h2{font-size:24px;line-height:1.35;margin:0 0 14px}h3{line-height:1.4;margin:5px 0 12px;font-size:18px}p{margin:8px 0 16px}.muted{color:var(--muted)}.eyebrow{font-size:12px;font-weight:750;letter-spacing:1.4px;text-transform:uppercase;color:var(--green)}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:36px;margin:30px 0}.hero p{max-width:640px}.panel,.lesson,.question{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}.plan{background:#e4ede1}.plan ol{padding-left:23px;margin-bottom:0}.plan li{margin:10px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 30px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:16px}.stat strong{display:block;font-size:30px;line-height:1.3}.stat span{font-size:13px;color:var(--muted)}.toolbar,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input{flex:1;min-width:180px}input,select,textarea{border:1px solid #bdcdc2;border-radius:9px;background:white;padding:10px 12px;color:var(--ink);max-width:100%}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.lesson{display:flex;flex-direction:column;gap:10px;position:relative}.lesson h3{font-size:17px}.lesson button{margin-top:auto;align-self:flex-start}.tag{display:inline-block;background:var(--light);color:var(--green);font-size:12px;padding:3px 9px;border-radius:20px}.small{font-size:13px}.lesson .count{color:var(--muted);font-size:13px}.progress{height:5px;border-radius:5px;background:#dee7df;overflow:hidden}.progress i{display:block;height:100%;background:#5b9470}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}.passage{position:sticky;top:18px;max-height:86vh;overflow:auto;white-space:pre-wrap;font-family:Georgia,serif;font-size:18px;line-height:1.85}.passage h3{font-family:system-ui,sans-serif}.question{margin-bottom:15px}.question .stem{white-space:pre-wrap;line-height:1.7}.option{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:9px;cursor:pointer}.option input{margin:7px 0 0;accent-color:var(--green);flex-shrink:0}.option:has(input:checked){border-color:var(--green);background:#edf6ee}.option.correct{border-color:#29824f;background:#e6f4e7}.option.wrong{border-color:#bd5140;background:#fff0ec}.explanation{border-left:3px solid #3f8862;padding:8px 14px;margin-top:16px;background:#f1f7ef}.warning{background:#fff4dc;border:1px solid #e9cf92;padding:12px 16px;border-radius:12px}.result{background:var(--ink);color:white;padding:24px;border-radius:16px;margin:20px 0}.result strong{font-size:32px}.qnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.qnav a{color:var(--ink);text-decoration:none;background:#e5eee4;border-radius:6px;padding:6px 12px}.qnav a.done{background:#23755b;color:white}.qnav a.bad{background:#ac4935;color:white}.vocabgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.word{padding:18px;border:1px solid var(--line);border-radius:14px;background:white}.word strong{font-size:20px}.word .chunk{color:var(--green);font-weight:600}dialog{border:0;border-radius:22px;width:min(650px,calc(100% - 28px));padding:0;color:var(--ink);box-shadow:0 20px 100px #0004}dialog::backdrop{background:#0b2c27bd;backdrop-filter:blur(3px)}.modalhead{padding:20px 25px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px}.modalbody{padding:22px 26px}.flash{background:#f0f4e9;border-radius:18px;min-height:230px;padding:26px;text-align:center;margin:15px 0}.flash h2{font-family:Georgia,serif;font-size:35px;margin:10px 0}.flash .answer{border-top:1px solid #c8d8c5;margin-top:20px;padding-top:16px}.ratings{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.ratings button{flex:1;min-width:120px}.hint{color:#94602d}.hidden{display:none!important}details{background:white;border:1px solid var(--line);border-radius:12px;padding:15px 18px;margin:12px 0}summary{cursor:pointer;font-weight:650}.writing textarea{width:100%;min-height:100px;margin-top:10px}.empty{padding:35px;text-align:center}.footer{font-size:12px;color:var(--muted);margin-top:40px;border-top:1px solid var(--line);padding-top:20px}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#163f37;color:white;border-radius:12px;padding:12px 22px;max-width:90vw;z-index:20}.scoreline{display:flex;gap:22px;align-items:center;justify-content:space-between;flex-wrap:wrap}.source{font-size:13px}.stickybar{position:sticky;bottom:10px;padding:12px 16px;border:1px solid #bbcdbf;border-radius:14px;background:#fffef9f2;box-shadow:0 3px 20px #173d3914;display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:2}

<script>
const LESSONS=[{"id": 0, "cat": "Quảng cáo", "title": "JAPANESE CUISINE: A JOURNEY THROUGH CULTURE AND TRADITION", "passage": "Discover how Japanese food reflects history, creativity and respect for nature.\nJapanese cuisine, (9) ________ as washoku, is admired for its balance of flavours, seasonal ingredients and artistic presentation. Rather than focusing only on taste, Japanese chefs pay close attention to colour, texture and freshness. Sushi, tempura and miso soup are widely recognised, but regional specialities also play an important role in the country’s culinary (10) ________. \nJapanese dining customs also reveal important cultural values. Meals are often prepared with care, and dishes selected according to the season can introduce diners to local traditions. Visitors should try (11) ________ authentic Japanese meal to experience these customs firsthand. In many restaurants, chefs combine traditional cooking methods with modern techniques to create (12) ________. Japanese cuisine continues to gain international recognition because of its quality, (13) ________ and cultural significance.\nAdapted from the Japan National Tourism Organization (JNTO)", "qs": [{"n": 9, "stem": "", "opts": ["was known", "knowing", "known", "which knows"], "answer": 2, "explain": "“Known as washoku” là mệnh đề quan hệ bị động rút gọn từ “which is known as washoku”. A tạo thêm động từ chia thì không có liên từ; B mang nghĩa chủ động; D sai nghĩa và hòa hợp.", "id": "l0q9"}, {"n": 10, "stem": "", "opts": ["technique", "identity", "ingredient", "health"], "answer": 1, "explain": "Culinary identity = bản sắc ẩm thực. Technique là kỹ thuật, ingredient là nguyên liệu, health là sức khỏe; ba từ này không diễn đạt bản sắc văn hóa.", "id": "l0q10"}, {"n": 11, "stem": "", "opts": ["a", "Ø", "the", "an"], "answer": 3, "explain": "Dùng an trước authentic vì từ này bắt đầu bằng âm nguyên âm /ɔː/. Danh từ meal đếm được, số ít và được giới thiệu lần đầu.", "id": "l0q11"}, {"n": 12, "stem": "", "opts": ["dining memorable experiences", "memorable dining experiences", "experiences memorable dining", "experiences dining memorable"], "answer": 1, "explain": "Trật tự: tính từ đánh giá memorable + dining bổ nghĩa loại trải nghiệm + danh từ chính experiences.", "id": "l0q12"}, {"n": 13, "stem": "", "opts": ["diverse", "diversify", "diversity", "diversely"], "answer": 2, "explain": "Sau quality và trước cultural significance cần danh từ song song: diversity (sự đa dạng). Diverse là tính từ, diversify là động từ, diversely là trạng từ.", "id": "l0q13"}], "words": ["v0", "v1", "v2", "v3", "v4", "v5"]}, {"id": 1, "cat": "Quảng cáo", "title": "THE LIFE STORIES WE ADMIRE: INNOVATORS AND VISIONARIES", "passage": "Discover the inspiring stories of people who overcame challenges and made history!\nThese (9)……………..individuals are remembered for their ( 10)………………and creative breakthroughs. While they were (11) ______ while growing up, many faced hardships but never gave up. Some had a difficult childhood, yet their determination led to greatness. For example, Thomas Edison, (12)…………the electric light bulb, showed that persistence pays off. These figures are admired for their courage and determination to change ( 13)……… world. Be inspired by their journeys and find the motivation to follow your dreams!", "qs": [{"n": 9, "stem": "", "opts": ["admire", "admiration", "admirable", "admiring"], "answer": 2, "explain": "Admirable là tính từ “đáng ngưỡng mộ”, bổ nghĩa cho individuals. Admire là động từ; admiration là danh từ; admiring mô tả người đang ngưỡng mộ.", "id": "l1q9"}, {"n": 10, "stem": "", "opts": ["achievements scientific impressive", "impressive scientific achievements", "achievements impressive scientific", "scientific achievements impressive"], "answer": 1, "explain": "Impressive (đánh giá) + scientific (lĩnh vực) + achievements (danh từ chính): những thành tựu khoa học ấn tượng.", "id": "l1q10"}, {"n": 11, "stem": "", "opts": ["struggling", "competing", "experimenting", "hesitating"], "answer": 0, "explain": "Were struggling while growing up = đã vật lộn với khó khăn khi trưởng thành. Hardships và never gave up là dấu hiệu ngữ cảnh; các phương án còn lại là cạnh tranh, thử nghiệm, do dự.", "id": "l1q11"}, {"n": 12, "stem": "", "opts": ["inventing", "invented", "that invented", "who invented"], "answer": 3, "explain": "Sau dấu phẩy cần mệnh đề quan hệ không xác định: “who invented the electric light bulb”. That không dùng trong cấu trúc này; who was invented là bị động sai nghĩa. Phương án D đã được sửa thành who invented để câu có đáp án đúng.", "id": "l1q12"}, {"n": 13, "stem": "", "opts": ["a", "no article", "the", "an"], "answer": 2, "explain": "The world là thế giới được hiểu là duy nhất trong ngữ cảnh. Không dùng a/an hoặc bỏ mạo từ ở cụm change the world.", "id": "l1q13"}], "words": ["v6", "v7", "v8", "v9", "v10", "v11"]}, {"id": 2, "cat": "Quảng cáo", "title": "GO GREEN – MAKE A DIFFERENCE TODAY!", "passage": "Do you want to protect our planet and build a greener future? Join our green living movement and discover simple ways to make a positive impact on the environment!\nWHY CHOOSE GREEN LIVING?\nReduce Waste: By reducing household waste and minimizing single-use plastics, everyone can (9) ______ a positive contribution to protecting the environment.\nChoose Eco-Friendly Products: Try sustainable products such as (10) ______ and locally grown organic food to protect natural resources.\nCreate a Better Future: Make your home cleaner and (11) ______ for future generations.\nJoin Local Activities: Take part in recycling programs (12) ______ worldwide for their effectiveness in reducing waste and protecting the environment.\nACT NOW – SAVE OUR PLANET!\nJoin us today to protect (13) ______ soul of our planet through simple, sustainable choices. Together, we can make our communities greener and our future brighter!", "qs": [{"n": 9, "stem": "", "opts": ["take", "give", "do", "make"], "answer": 3, "explain": "Cụm cố định make a contribution to + N/V-ing = đóng góp cho. Take/give/do không kết hợp với contribution theo cách này.", "id": "l2q9"}, {"n": 10, "stem": "", "opts": ["a shopping bag reusable", "a reusable shopping bag", "an reusable shopping bag", "reusable a shopping bag"], "answer": 1, "explain": "A + reusable + shopping bag: mạo từ + tính từ + danh từ ghép. Reusable bắt đầu bằng âm /r/, nên dùng a, không dùng an.", "id": "l2q10"}, {"n": 11, "stem": "", "opts": ["sustainability", "sustainable", "sustainably", "unsustainably"], "answer": 1, "explain": "Sau make + tân ngữ, dùng tính từ làm bổ ngữ: make your home cleaner and sustainable. Sustainability là danh từ; hai đuôi -ly là trạng từ.", "id": "l2q11"}, {"n": 12, "stem": "", "opts": ["was praised", "praising", "praised", "which praises"], "answer": 2, "explain": "Programs praised worldwide = programs which are praised worldwide. Chương trình được khen ngợi nên dùng phân từ quá khứ bị động, không dùng praising.", "id": "l2q12"}, {"n": 13, "stem": "", "opts": ["a", "Ø", "the", "an"], "answer": 2, "explain": "The soul of our planet: hình ảnh “linh hồn của hành tinh” đã được xác định bởi of our planet.", "id": "l2q13"}], "words": ["v12", "v13", "v14", "v15", "v16", "v17"]}, {"id": 3, "cat": "Quảng cáo", "title": "DISCOVER CULTURES THROUGH STORIES", "passage": "Are you interested in the people and traditions behind the food we eat? Join our Culture Connections Day and (9) ______ the stories that make every community special. This school event brings students together through food, music and friendly conversation. You do not need to travel abroad to begin learning about another way of life.\nVisitors can attend (10) ______ exciting workshop on family recipes. Student volunteers will introduce a (11) ______ and explain how its members keep their traditions alive. There will also be a display of photographs and short interviews collected by our English club. Guests (12) ______ part in the storytelling session can share a memory about a special meal at home.\nOur activities encourage (13) ______ between people with different backgrounds. Instead of judging an unfamiliar custom too quickly, participants can ask respectful questions and listen to different points of view. You may discover that families celebrate in different ways while sharing similar hopes for their children.\nThe event runs from nine until eleven on Saturday morning in the school hall. Admission is free. Please bring your own water bottle and avoid disposable cups. Register with your class monitor before Thursday so that the organisers can prepare enough materials. Come with a friend, bring your curiosity, and help us build a school where everyone feels welcome.\n(Adapted from UNESCO, What is Intercultural Dialogue (2021; updated 2023))", "qs": [{"n": 9, "stem": "", "opts": ["discover", "invent", "deliver", "replace"], "answer": 0, "explain": "Discover the stories = khám phá những câu chuyện. Invent là phát minh, deliver là chuyển/giao, replace là thay thế nên không hợp nghĩa.", "id": "l3q9"}, {"n": 10, "stem": "", "opts": ["a", "an", "the", "Ø (no article)"], "answer": 1, "explain": "An exciting workshop: exciting bắt đầu bằng âm nguyên âm, workshop là danh từ số ít được giới thiệu lần đầu.", "id": "l3q10"}, {"n": 11, "stem": "", "opts": ["local small farming community", "farming local small community", "small local farming community", "community small local farming"], "answer": 2, "explain": "Small (kích thước) + local (địa phương) + farming (loại cộng đồng) + community (danh từ chính).", "id": "l3q11"}, {"n": 12, "stem": "", "opts": ["take", "taken", "to taking", "taking"], "answer": 3, "explain": "Guests taking part = guests who take/are taking part. Chủ thể chủ động tham gia nên rút gọn bằng V-ing; taken mang nghĩa bị động.", "id": "l3q12"}, {"n": 13, "stem": "", "opts": ["understand", "understood", "understanding", "understandably"], "answer": 2, "explain": "Encourage understanding = khuyến khích sự thấu hiểu. Cần danh từ sau động từ encourage trong câu này; understandably là trạng từ.", "id": "l3q13"}], "words": ["v18", "v19", "v20", "v21", "v22", "v23"]}, {"id": 4, "cat": "Quảng cáo", "title": "THE TAPESTRY OF VIETNAMESE CUISINE: EVERYTHING YOU SHOULD KNOW", "passage": "Vietnamese cuisine is a delightful journey through vibrant flavors and fresh ingredients. Renowned for its balance of sweet, sour, salty, and spicy tastes, each dish (9)___ a story of tradition and regional diversity. From the famous pho, (10)___, to banh mi, a delicious sandwich bursting with textures, every bite is an adventure. Fresh herbs like cilantro and basil, along with seasonal vegetables, enhance the dishes, which makes them not only tasty but also (11)…….. . Street food culture thrives in Vietnam, offering an array of culinary delights from bustling markets and roadside stalls. Don’t miss the chance to try  spring rolls, seafood, and the iconic Vietnamese coffee, (12) for its rich flavor and unique preparation. Immerse yourself in this culinary experience and discover why Vietnamese cuisine is celebrated worldwide for its freshness and creativity. Join us in exploring (13) _____ heart of Vietnam through its unforgettable flavors!\n(Adapted from redbeanrestaurants.com)", "qs": [{"n": 9, "stem": "", "opts": ["speaks", "tells", "says", "talks"], "answer": 1, "explain": "Tell a story là cụm cố định “kể một câu chuyện”. Say thường đi với lời nói; speak/talk không trực tiếp đi với a story theo nghĩa này.", "id": "l4q9"}, {"n": 10, "stem": "", "opts": ["an fragrant noodle soup", "a noodle soup fragrant", "a fragrant noodle soup", "fragrant a noodle soup"], "answer": 2, "explain": "A fragrant noodle soup: a trước âm /f/, fragrant là tính từ đặt trước danh từ ghép noodle soup.", "id": "l4q10"}, {"n": 11, "stem": "", "opts": ["healthy", "healthily", "health", "healthiness"], "answer": 0, "explain": "Not only tasty but also healthy: hai tính từ song song. Health/healthiness là danh từ, healthily là trạng từ.", "id": "l4q11"}, {"n": 12, "stem": "", "opts": ["which knows", "was known", "knowing", "known"], "answer": 3, "explain": "Coffee, known for its rich flavor,... = coffee, which is known for... Rút gọn bị động dùng known.", "id": "l4q12"}, {"n": 13, "stem": "", "opts": ["the", "a", "an", "Ø"], "answer": 0, "explain": "The heart of Vietnam là cụm xác định: trung tâm/cốt lõi của Việt Nam. Chỗ trống này đã được gắn số (13) cho khớp câu hỏi.", "id": "l4q13"}], "words": ["v24", "v25", "v26", "v27", "v28", "v29"]}, {"id": 5, "cat": "Tờ rơi", "title": "RECYCLE TODAY, PROTECT TOMORROW!", "passage": "How can we turn everyday waste into something useful?\nRecycling is a simple way to protect our environment. It means collecting and processing used materials to make new products. Every day, we (14) ________ paper, plastic bottles, glass and cans. However, we can take these materials out of the rubbish bin and send them to recycling centres. Recycling helps save natural resources, reduce pollution and save energy. \nHow can you recycle at home and at school? First, put paper, plastic and metal into the correct bins. Rinse out containers before recycling them. (15) ________ throwing away old books, clothes or bags, try to reuse or donate them. You can also reduce the amount of waste you produce by using (16) ________ bottles and bags. Remember to (17) ________ an effort to sort your rubbish every day. If some materials cannot be recycled, look for (18) ________  ways to reuse them. Small actions can make a big difference!\nAdapted from the U.S. Environmental Protection Agency (EPA), Recycling Basics and Benefits", "qs": [{"n": 14, "stem": "", "opts": ["give away", "throw away", "take away", "pass away"], "answer": 1, "explain": "Throw away = vứt bỏ. Give away = cho tặng; take away = mang đi; pass away = qua đời. Ngữ cảnh là rác bị thải bỏ hằng ngày.", "id": "l5q14"}, {"n": 15, "stem": "", "opts": ["instead of", "because of", "except for", "apart from"], "answer": 0, "explain": "Instead of + V-ing = thay vì làm gì. Câu khuyên tái sử dụng hoặc quyên góp thay vì vứt đồ cũ đi; các cụm còn lại không thể hiện sự thay thế.", "id": "l5q15"}, {"n": 16, "stem": "", "opts": ["impressive", "traditional", "single-use", "reusable"], "answer": 3, "explain": "Reusable bottles and bags = chai và túi dùng lại được. Single-use có nghĩa ngược lại: dùng một lần.", "id": "l5q16"}, {"n": 17, "stem": "", "opts": ["get", "do", "make", "take"], "answer": 2, "explain": "Make an effort to + V = nỗ lực làm gì. Không dùng get/do/take an effort.", "id": "l5q17"}, {"n": 18, "stem": "", "opts": ["the other", "other", "another", "others"], "answer": 1, "explain": "Other + danh từ số nhiều: other ways. Another đi với danh từ số ít; others đứng độc lập; the other chỉ phần còn lại đã xác định.", "id": "l5q18"}], "words": ["v30", "v31", "v32", "v33", "v34", "v35"]}, {"id": 6, "cat": "Tờ rơi", "title": "TRAVEL GREEN, SAVE THE EARTH", "passage": "How can we use eco-friendly transportation \nUsing eco-friendly transportation helps protect our planet. When traveling short (14)……….., it’s better to walk or use a bicycle instead of a car. Walking and cycling are good for the environment and for your health. For longer trips, you can ( 15)……….public transport like buses or trains. They carry many people and produce less pollution than cars. (16)…………..way to help is carpooling, which means sharing a car with friends or family. This  reduces the number of cars on the road. (17)………….choosing petrol cars, many people  now prefer electric cars, even though they can be expensive. Small changes, such as cycling or using public transport, can make a big difference. Let’s raise (18)………………. of eco-friendly transport and inspire others to care for the planet.", "qs": [{"n": 14, "stem": "", "opts": ["highways", "paths", "distances", "space"], "answer": 2, "explain": "Travel short distances = di chuyển những quãng đường ngắn. Phương án distance của bản gốc đã được sửa thành distances để đúng cấu trúc thông dụng.", "id": "l6q14"}, {"n": 15, "stem": "", "opts": ["take up", "use up", "rely on", "switch off"], "answer": 2, "explain": "Rely on public transport = dựa vào/sử dụng phương tiện công cộng. Take up = bắt đầu thú vui; use up = dùng hết; switch off = tắt.", "id": "l6q15"}, {"n": 16, "stem": "", "opts": ["Another", "Other", "Others", "The others"], "answer": 0, "explain": "Another + danh từ đếm được số ít: another way = một cách khác. Other cần danh từ số nhiều hoặc không đếm được; others/the others không trực tiếp bổ nghĩa way.", "id": "l6q16"}, {"n": 17, "stem": "", "opts": ["In addition to", "Because of", "In view of", "Instead of"], "answer": 3, "explain": "Instead of + V-ing: thay vì chọn xe xăng, nhiều người chọn xe điện. Because of là vì; in addition to là ngoài; in view of là xét đến.", "id": "l6q17"}, {"n": 18, "stem": "", "opts": ["awareness", "concerns", "problems", "money"], "answer": 0, "explain": "Raise awareness of = nâng cao nhận thức về. Raise money là quyên tiền nhưng không phù hợp với thông điệp tuyên truyền giao thông xanh.", "id": "l6q18"}], "words": ["v36", "v37", "v38", "v39", "v40", "v41"]}, {"id": 7, "cat": "Tờ rơi", "title": "EXPLORE THE BEAUTY OF A MULTICULTURAL WORLD!", "passage": "In today’s globalized era, living in a diverse society allows us to experience various cultures and broaden our perspectives every day. Let’s look at how we can celebrate diversity in our communities.\nWhat We Can Do:\nEmbrace Cultural Diversity: Be open to learning about different customs, traditions, and cuisines. Experiencing authentic food or attending international festivals not only (14) __________ barriers between communities but also builds mutual respect. Embracing new cultural traditions can (15)… __________ a great contribution to promoting social harmony.\nRespect Differences: Avoid making (16) __________ generalizations about people from other backgrounds. Always treat everyone with equality and open-mindedness. Valuing diversity helps create an inclusive environment where every individual feels welcomed.\nPromote Communication: Whenever you interact with people from diverse backgrounds, practice active listening. Use clear language and learn basic greetings (17) __________ relying solely on assumptions to prevent misunderstandings.\nRemember, embracing small cultural differences today will pave the way for (18) __________ meaningful cross-cultural connections in the future.", "qs": [{"n": 14, "stem": "", "opts": ["breaks down", "catches up", "gets on", "turns off"], "answer": 0, "explain": "Break down barriers = phá bỏ rào cản. Chủ ngữ là hoạt động “Experiencing ... or attending ...” được coi là số ít nên dùng breaks down. Catch up = bắt kịp; get on = hòa thuận/lên xe; turn off = tắt.", "id": "l7q14"}, {"n": 15, "stem": "", "opts": ["get", "do", "make", "take"], "answer": 2, "explain": "Make a contribution to promoting = đóng góp vào việc thúc đẩy. To là giới từ nên theo sau bởi V-ing.", "id": "l7q15"}, {"n": 16, "stem": "", "opts": ["impressive", "traditional", "biased", "eco-friendly"], "answer": 2, "explain": "Biased generalizations = những khái quát/nhận định thiên lệch. Nội dung yêu cầu tránh định kiến về người khác; impressive/traditional/eco-friendly không mang nghĩa này.", "id": "l7q16"}, {"n": 17, "stem": "", "opts": ["instead of", "due to", "in spite of", "thanks to"], "answer": 0, "explain": "Instead of relying solely on assumptions = thay vì chỉ dựa vào giả định. Due to/thanks to chỉ nguyên nhân, in spite of chỉ nhượng bộ.", "id": "l7q17"}, {"n": 18, "stem": "", "opts": ["others", "other", "another", "much"], "answer": 1, "explain": "Other meaningful ... connections: other đi với danh từ số nhiều connections. Another cần số ít; others đứng độc lập; much dùng với danh từ không đếm được.", "id": "l7q18"}], "words": ["v42", "v43", "v44", "v45", "v46", "v47"]}, {"id": 8, "cat": "Tờ rơi", "title": "BUILD A GREENER SCHOOL", "passage": "Schools in Ho Chi Minh City have promoted environmental protection through saving energy, recycling and sorting waste. Their green school model also encourages students to share good habits with families and friends. You can support these goals through simple actions during your school day.\nSAVE ENERGY\nBefore leaving an empty classroom, (14) ______ the lights and fans. Check that nobody still needs them, and remind your classmates to do the same. Using electricity carefully is one way to protect natural resources.\nREDUCE RUBBISH\nBring a reusable bottle instead of buying a disposable one. Keep notebooks with empty pages for further use. These small decisions can reduce (15) ______ and help you avoid buying things unnecessarily. Choose durable supplies whenever possible, and keep your desk tidy so that useful items do not get lost.\nSORT AND SHARE\nPut recyclable materials in the correct collection bins. (16) ______ addition to sorting rubbish, talk to your classmates about ways to prevent it. Your class can make a real (17) ______ to the amount of waste it produces by working together daily.\nSTART SMALL\nChoose (18) ______ practical actions that you can repeat every day. Keep a short record of your progress and share useful ideas at home. At the end of each week, discuss which habit was easiest and choose one new goal for the following week. A greener school begins with habits that everyone can practise.\n(Adapted from Việt Nam News, “HCM City expands ‘green school’ model”, 10 October 2020)", "qs": [{"n": 14, "stem": "", "opts": ["look up", "turn off", "give away", "put on"], "answer": 1, "explain": "Turn off the lights and fans = tắt đèn và quạt. Look up = tra cứu; give away = cho đi; put on = mặc/bật thiết bị trong một số ngữ cảnh.", "id": "l8q14"}, {"n": 15, "stem": "", "opts": ["tradition", "identity", "waste", "culture"], "answer": 2, "explain": "Reduce waste = giảm rác thải/lãng phí. Tái dùng giấy và chai giúp giảm waste, không phải tradition, identity hay culture.", "id": "l8q15"}, {"n": 16, "stem": "", "opts": ["On", "At", "By", "In"], "answer": 3, "explain": "Cụm cố định in addition to + N/V-ing = ngoài việc. Không dùng on/at/by addition to.", "id": "l8q16"}, {"n": 17, "stem": "", "opts": ["difference", "decision", "mistake", "promise"], "answer": 0, "explain": "Make a difference to = tạo ra sự thay đổi/tác động tới. Các cụm make a decision/mistake/promise có nghĩa khác.", "id": "l8q17"}, {"n": 18, "stem": "", "opts": ["another", "others", "a few", "a little"], "answer": 2, "explain": "A few + danh từ đếm được số nhiều: a few practical actions. A little dùng với danh từ không đếm được; another cần số ít; others không đứng trước danh từ.", "id": "l8q18"}], "words": ["v48", "v49", "v50", "v51", "v52", "v53"]}, {"id": 9, "cat": "Tờ rơi", "title": "GO GREEN – START WITH YOURSELF! 🌿", "passage": "Let’s(14)________ awareness and inspire others to live a greener life! This Green Day, our school encourages everyone to practice the eco-friendly habit of recycling plastic. Instead of using and ( 15)________bottles or bags after one use, try to reuse them or put them in recycling bins. Recycling helps reduce pollution, save energy, and protect nature for future (16)______.\nRemember, (17)____small action counts. Bring your own water bottle, say no to single-use plastic, and spread the message to your friends and family. Together, we can make our planet cleaner and greener.\nLet’s go (18)_________ today—because protecting the Earth is not just a choice, it’s our responsibility! ♻️", "qs": [{"n": 14, "stem": "", "opts": ["rise", "raise", "rouse", "arise"], "answer": 1, "explain": "Raise awareness = nâng cao nhận thức. Raise có tân ngữ; rise và arise thường không có tân ngữ; rouse là đánh thức/khơi dậy.", "id": "l9q14"}, {"n": 15, "stem": "", "opts": ["throwing away", "taking over", "carrying out", "looking after"], "answer": 0, "explain": "Using and throwing away: hai V-ing song song sau instead of. Throw away = vứt bỏ; take over = tiếp quản; carry out = thực hiện; look after = chăm sóc.", "id": "l9q15"}, {"n": 16, "stem": "", "opts": ["generations", "houses", "businesses", "individuals"], "answer": 0, "explain": "Future generations = các thế hệ tương lai. Ngữ cảnh bảo vệ thiên nhiên lâu dài, không phải nhà ở/doanh nghiệp/cá nhân.", "id": "l9q16"}, {"n": 17, "stem": "", "opts": ["other", "others", "every", "the others"], "answer": 2, "explain": "Every + danh từ đếm được số ít: every small action counts. Bản gốc tô đáp án others nhưng không đúng: others là đại từ, không đứng trước small action. Đáp án đã sửa thành C.", "id": "l9q17"}, {"n": 18, "stem": "", "opts": ["green", "clean", "blue", "bright"], "answer": 0, "explain": "Go green = sống xanh/thực hiện lối sống thân thiện môi trường. Đây là cụm thông dụng phù hợp chủ đề; go blue/bright không diễn đạt nghĩa đó.", "id": "l9q18"}], "words": ["v39", "v54", "v55", "v56", "v57", "v58"]}, {"id": 10, "cat": "Đọc hiểu", "title": "OUR PLASTIC FOOTPRINT: REUSE BEFORE RECYCLING", "passage": "Plastic is widely used in everyday life, from food packaging to water bottles. However, the growing amount of plastic waste has created serious environmental problems. Many plastic items are thrown away after being used only once, even though some could be used again. Recycling is helpful, but it cannot solve the problem alone. Reducing plastic consumption and reusing products are also important steps towards a cleaner planet.\nOne effective way to reduce waste is to reuse plastic containers. For example, strong plastic tubs can be used to store leftover food or small household items instead of being thrown away. Refillable water bottles are another useful choice because they reduce the need to buy new bottles. Before reusing any container, people should clean it properly and make sure it is suitable for its new purpose. These simple habits can reduce the amount of waste sent to recycling centres and landfills.\nRecycling still plays an important role in managing plastic waste. People should separate recyclable items and follow local recycling guidelines. However, some plastic products are difficult to recycle, and recycling facilities cannot process every type of plastic. Therefore, we should avoid unnecessary plastic packaging whenever possible. \nBy reducing, reusing and recycling responsibly, individuals can help protect natural resources and reduce pollution. Small changes in daily habits can make a real difference when many people take part.\nAdapted from Lucy Siegle, “Our plastic footprint: reuse to take the pressure off recycling,” The Guardian, 27 July 2018.", "qs": [{"n": 21, "stem": "According to the passage, why are refillable water bottles a useful choice?", "opts": ["They make plastic containers easier to clean.", "They reduce the need to buy new bottles.", "They allow people to recycle all types of plastic.", "They prevent recycling centres from collecting waste."], "answer": 1, "explain": "Đoạn 2 nói trực tiếp: “they reduce the need to buy new bottles”. Chai châm lại được làm giảm nhu cầu mua chai mới; không làm cho mọi loại nhựa đều tái chế được.", "id": "l10q21"}, {"n": 22, "stem": "Which of the following is NOT mentioned as a way to manage plastic waste?", "opts": ["Reusing strong plastic tubs for household purposes.", "Cleaning containers before reusing them.", "Following local recycling guidelines.", "Buying products made from recycled paper."], "answer": 3, "explain": "A, B, C đều xuất hiện trong đoạn 2–3. Bài không đề cập mua sản phẩm làm từ giấy tái chế, nên D đáp ứng yêu cầu NOT mentioned.", "id": "l10q22"}, {"n": 23, "stem": "The word “it” in paragraph 2 refers to ______.", "opts": ["plastic waste", "a container", "a recycling centre", "a water bottle"], "answer": 1, "explain": "“Before reusing any container, people should clean it properly”: it thay cho any container ngay trước đó, không phải rác hay trung tâm tái chế.", "id": "l10q23"}, {"n": 24, "stem": "The word “unnecessary” in paragraph 3 is closest in meaning to ______.", "opts": ["essential", "unneeded", "valuable", "convenient"], "answer": 1, "explain": "Unnecessary = không cần thiết = unneeded. Essential là thiết yếu (trái nghĩa), valuable là có giá trị, convenient là tiện lợi.", "id": "l10q24"}, {"n": 25, "stem": "What is the main idea of paragraph 3?", "opts": ["The importance of recycling plastic responsibly.", "The benefits of producing more plastic packaging.", "The difficulties of collecting plastic waste locally.", "The reasons for using plastic in daily life."], "answer": 0, "explain": "Đoạn 3 nói phân loại, tuân thủ hướng dẫn và tránh bao bì không cần thiết do khả năng tái chế có giới hạn. A bao quát việc tái chế có trách nhiệm; B ngược ý, C/D quá hẹp hoặc lệch ý.", "id": "l10q25"}], "words": ["v59", "v60", "v61", "v62", "v63", "v64"]}, {"id": 11, "cat": "Đọc hiểu", "title": "THE IMPORTANCE OF RECYCLING", "passage": "Recycling is one of the most effective ways to protect the environment and reduce waste. Many products, such as plastic bottles, cans, and paper, can be recycled and used again instead of being thrown away. By recycling, we can reduce the amount of waste that ends up in landfills, which helps reduce pollution and conserve natural resources.\nThere are many materials that can be recycled, but some other materials are often overlooked, such as electronic devices or old batteries. These items contain harmful chemicals that can harm the environment if not disposed of properly. It’s important to take them to designated recycling centers.\nIn addition to reducing waste, recycling also helps save energy. It takes less energy to recycle materials than to produce new products from raw materials. This, in turn, helps lower carbon emissions and combats climate change. When people choose to recycle, they not only reduce waste but also help protect the planet for future generations.\nWhile recycling seems like a small action, it has a large impact when practiced consistently by many people. Simple actions, like separating your items at home and making sure to recycle plastic, glass, and paper, can  make a big difference.\n                                                                     (Adapted from https://www.colorado.edu)", "qs": [{"n": 21, "stem": "What is the best title or main idea for this passage?", "opts": ["How Recycling Helps the Environment", "The Dangers of Using Plastic Bags", "Simple Ways to Decorate Your Home", "Reasons Why People Don’t Recycle"], "answer": 0, "explain": "Cả bốn đoạn đều giải thích lợi ích của tái chế với rác thải, tài nguyên, năng lượng và khí hậu. A bao quát toàn bài; các lựa chọn khác chỉ nói túi nhựa, trang trí hoặc lý do không tái chế.", "id": "l11q21"}, {"n": 22, "stem": "According to the passage, which of the following is NOT mentioned as a material that can be recycled?", "opts": ["Cans", "Plastic bottles", "Food waste", "Paper"], "answer": 2, "explain": "Đoạn 1 kể plastic bottles, cans, paper; đoạn 2 thêm thiết bị điện tử và pin. Food waste không được nhắc như vật liệu tái chế trong bài này.", "id": "l11q22"}, {"n": 23, "stem": "The word conserve in paragraph 1 could be best replaced by ________.", "opts": ["destroy", "create", "protect", "use up"], "answer": 2, "explain": "Conserve natural resources = bảo tồn/bảo vệ tài nguyên; protect gần nghĩa nhất. Destroy/use up mang nghĩa phá hủy/dùng cạn; create là tạo ra.", "id": "l11q23"}, {"n": 24, "stem": "According to the passage, why is recycling electronic devices and old batteries important?", "opts": ["Because they are made of valuable metals.", "Because they take up too much space.", "Because they can be used again easily.", "Because they contain harmful chemicals."], "answer": 3, "explain": "Đoạn 2: “These items contain harmful chemicals”. Thiết bị điện tử và pin cần xử lý đúng vì chứa hóa chất gây hại, chứ bài không nêu lý do giá trị kim loại.", "id": "l11q24"}, {"n": 25, "stem": "The word “they” in paragraph 3 refers to________.", "opts": ["People who recycle", "Future generations", "Raw materials", "New products"], "answer": 0, "explain": "“When people choose to recycle, they ...”: they thay cho people who recycle. Future generations là đối tượng được hưởng lợi, không phải chủ thể hành động.", "id": "l11q25"}], "words": ["v65", "v66", "v67", "v68", "v69", "v70"]}, {"id": 12, "cat": "Đọc hiểu", "title": "GREEN LIVING: SMALL CHANGES, BIG IMPACTS", "passage": "Green living is an important way to protect the environment and create a healthier future. People can adopt a greener lifestyle by making simple changes to their daily routines. For example, using reusable shopping bags, carrying water bottles, and avoiding single-use plastics can significantly reduce the amount of waste we produce. These actions also help preserve natural resources for future generations.\nAnother effective way to live green is to save energy at home. Turning off lights when they are not needed, using energy-efficient appliances, and taking advantage of natural light can reduce electricity consumption. Moreover, walking, cycling, or using public transport instead of private cars helps reduce air pollution and carbon emissions.\nGreen living also involves making responsible choices about food. Buying locally grown vegetables and fruits can reduce transportation costs and emissions. People can also plan their meals carefully to avoid wasting food. In addition, composting fruit and vegetable scraps can turn food waste into useful fertilizer for plants.\nAlthough these actions may seem small, they can make a significant difference when many people practise them regularly. By working together, individuals and communities can protect the planet and build a more sustainable future.\n(Adapted for educational purposes)", "qs": [{"n": 21, "stem": "What is the best title for the passage?", "opts": ["The Growing Threats to the Natural Environment", "Practical Steps Towards a More Eco-friendly Lifestyle", "The Economic Benefits of Modern Technology", "The Importance of Protecting Endangered Species"], "answer": 1, "explain": "Bài liệt kê các bước thực tế: túi tái sử dụng, tiết kiệm điện, đi lại xanh, thực phẩm địa phương và ủ phân. B bao quát nội dung về lối sống thân thiện môi trường.", "id": "l12q21"}, {"n": 22, "stem": "According to the passage, which of the following is NOT mentioned as a way to live green?", "opts": ["Using reusable shopping bags", "Saving electricity at home", "Buying locally grown food", "Travelling by plane more frequently"], "answer": 3, "explain": "A, B, C đều được đề cập. Đi máy bay thường xuyên hơn không có trong bài và không phải lời khuyên sống xanh ở đây.", "id": "l12q22"}, {"n": 23, "stem": "The word “significantly”in paragraph 1 is closest in meaning to ______.", "opts": ["temporarily", "gradually", "occasionally", "considerably"], "answer": 3, "explain": "Significantly = đáng kể, gần nghĩa considerably. Temporarily = tạm thời, gradually = dần dần, occasionally = thỉnh thoảng.", "id": "l12q23"}, {"n": 24, "stem": "According to the passage, why should people compost fruit and vegetable scraps?", "opts": ["To make food taste better", "To reduce the need for public transport", "To turn food waste into useful fertilizer", "To increase electricity consumption"], "answer": 2, "explain": "Đoạn 3: “composting ... can turn food waste into useful fertilizer for plants”. Ủ vụn rau quả để biến rác thực phẩm thành phân bón.", "id": "l12q24"}, {"n": 25, "stem": "The word “they” in paragraph 4 refers to ______.", "opts": ["Future generations", "natural resources", "these actions", "private cars"], "answer": 2, "explain": "“Although these actions may seem small, they ...”: they thay cho these actions, tức các hành động sống xanh đã liệt kê.", "id": "l12q25"}], "words": ["v71", "v72", "v73", "v74", "v75", "v76"]}, {"id": 13, "cat": "Đọc hiểu", "title": "WANGARI MAATHAI", "passage": "Wangari Maathai was born in Kenya in 1940. She studied in the United States and later continued her education in Germany and Kenya. At a time when many women had few opportunities for higher education, she built a career in science. Her life would eventually connect education with action for communities and the environment.\nIn 1977, Maathai established the Green Belt Movement. It encouraged women to plant trees to improve their surroundings. Planting them was a practical response to a serious problem. Trees were important because the loss of forests was affecting the lives of people who depended on the land. The movement spread beyond Kenya and helped bring tree planting to other African countries.\nMaathai's work showed that caring for nature could also support people. She connected environmental protection with democracy and peace. In 2004, she received the Nobel Peace Prize, becoming the first African woman to win it. This international recognition brought greater attention to her work and to the women taking part in the movement.\nHer story invites young readers to think about leadership differently. A leader does not always begin with a large organisation or an impressive title. A useful idea, education and the courage to act can create opportunities for others. Maathai's example continues to encourage people to take responsibility for the world around them.\n(Adapted from NobelPrize.org, Wangari Maathai – Biographical and Wangari Maathai – Facts)", "qs": [{"n": 21, "stem": "When did Maathai establish the Green Belt Movement?", "opts": ["In 1940", "In 2004", "In 1977", "In 2011"], "answer": 2, "explain": "Đầu đoạn 2 nêu rõ “In 1977, Maathai established the Green Belt Movement”. 1940 là năm sinh; 2004 là năm nhận Nobel.", "id": "l13q21"}, {"n": 22, "stem": "Which statement is NOT true according to the passage?", "opts": ["Maathai studied in the United States.", "The movement stayed entirely within Kenya.", "Maathai worked in science.", "Women took part in planting trees."], "answer": 1, "explain": "Đoạn 2 nói phong trào lan ra ngoài Kenya, tới các nước châu Phi khác. Vì vậy B “stayed entirely within Kenya” là phát biểu KHÔNG đúng; ba ý còn lại đều được nêu.", "id": "l13q22"}, {"n": 23, "stem": "The word “opportunities” in paragraph 1 is CLOSEST in meaning to ______.", "opts": ["chances", "problems", "rules", "results"], "answer": 0, "explain": "Opportunities = cơ hội, gần nghĩa chances. Problems = vấn đề; rules = quy tắc; results = kết quả.", "id": "l13q23"}, {"n": 24, "stem": "The word “them” in paragraph 2 refers to ______.", "opts": ["women", "forests", "countries", "trees"], "answer": 3, "explain": "“It encouraged women to plant trees ... Planting them ...”: them chỉ trees, đối tượng được trồng, không phải women/countries/forests.", "id": "l13q24"}, {"n": 25, "stem": "What is the main idea of paragraph 4?", "opts": ["Scientific careers always require foreign study.", "Only large organisations can change society.", "Leadership can grow from useful ideas and action.", "Young people should become famous before helping others."], "answer": 2, "explain": "Đoạn 4 nhấn mạnh ý tưởng hữu ích, giáo dục và lòng can đảm hành động có thể tạo cơ hội cho người khác. C khái quát ý này; A/B/D dùng always/only hoặc thêm điều kiện không có trong bài.", "id": "l13q25"}], "words": ["v77", "v78", "v79", "v80", "v81", "v82"]}, {"id": 14, "cat": "Đọc hiểu", "title": "Environmental Protection", "passage": "In today's rapidly changing world, the issue of environmental protection has become more pressing than ever before. With ecosystems facing unprecedented threats from human activities, it is imperative that we take concerted action to safeguard the environment for future generations.\nEnvironmental protection encompasses a wide range of initiatives aimed at preserving the natural world and minimizing human impact on ecosystems. One of the most pressing concerns is climate change, driven primarily by the emission of greenhouse gases such as carbon dioxide and methane. The consequences of climate change are far-reaching, including rising temperatures, extreme weather events, and disruptions to ecosystems and biodiversity. Another critical aspect of environmental protection is the conservation of natural habitats and biodiversity. Human activities such as deforestation, habitat destruction, and overexploitation of resources have led to a dramatic decline in global biodiversity. Protecting habitats and implementing conservation measures are essential for maintaining the balance of ecosystems and ensuring the survival of countless species.\nFurthermore, pollution poses a significant threat to the environment and human health. Whether it is air pollution from vehicle emissions and industrial activities, water pollution from agricultural runoff and wastewater discharge, or plastic pollution in oceans and waterways, the impacts of pollution are profound and far-reaching. Addressing pollution requires concerted efforts to reduce emissions, improve waste management practices, and promote sustainable alternatives.", "qs": [{"n": 21, "stem": "According to the passage, which of the following is mentioned as a major cause of climate change?", "opts": ["Overpopulation in urban areas", "Excessive use of renewable energy", "Natural climate cycles", "Emission of greenhouse gases"], "answer": 3, "explain": "Đoạn 2 nêu climate change “driven primarily by the emission of greenhouse gases”. D là nguyên nhân được bài chỉ rõ; không phải năng lượng tái tạo hay chu kỳ tự nhiên.", "id": "l14q21"}, {"n": 22, "stem": "Which of the following environmental issues is NOT mentioned in the passage?", "opts": ["Plastic pollution", "Noise pollution", "Biodiversity loss", "Climate change"], "answer": 1, "explain": "Bài nêu nhựa trong đại dương, suy giảm đa dạng sinh học và biến đổi khí hậu. Noise pollution (ô nhiễm tiếng ồn) không xuất hiện.", "id": "l14q22"}, {"n": 23, "stem": "The word “imperative” in the first paragraph is closest in meaning to:", "opts": ["Urgent", "Optional", "Unnecessary", "Traditional"], "answer": 0, "explain": "Imperative = cấp thiết, rất cần thiết; urgent gần nhất trong các lựa chọn. Optional = tùy chọn, unnecessary = không cần thiết, traditional = truyền thống.", "id": "l14q23"}, {"n": 24, "stem": "The word “it” in the last paragraph refers to________.", "opts": ["Pollution", "Industrial activities", "The environment", "Human health"], "answer": 0, "explain": "Đoạn cuối mở bằng pollution, rồi “Whether it is air pollution ... water pollution ... or plastic pollution ...”. It chỉ hiện tượng pollution nói chung.", "id": "l14q24"}], "words": ["v83", "v84", "v85", "v86", "v87", "v88"]}, {"id": 15, "cat": "Sắp xếp câu", "title": "Hội thoại và thư • Phần 1", "passage": "Chọn thứ tự hợp lý. Tìm câu mở đầu, câu đáp lời, từ nối và câu kết trước khi đối chiếu các phương án.", "qs": [{"n": 1, "stem": "Dear James,\n\na. Firstly, I enjoyed exploring the different themed areas, where I could see amazing castles and meet famous Disney characters.\n\nb. I wanted to tell you about Disneyland, a magical theme park that I recently visited with my family.\n\nc. Secondly, the exciting rides and colourful shows made the whole experience even more enjoyable.\n\nd. Besides, the friendly staff and beautiful decorations created a wonderful atmosphere for visitors of all ages.\n\ne. It was an unforgettable trip, and I hope to visit Disneyland again someday!\nWrite back soon.\nHenry", "opts": ["b – c – a – d – e", "b – c – a – d – e", "b – a – c – d – e", "c – b – a – d – e"], "id": "arr1", "answer": 2, "explain": "b giới thiệu chuyến đi → a Firstly nêu ý thứ nhất → c Secondly nêu ý thứ hai → d Besides bổ sung → e kết luận. A và B trong bản gốc trùng nhau, đều sai; giữ nguyên để đối chiếu."}, {"n": 2, "stem": "\na. Linh: Hi, Mai! Have you ever read about someone whose life story really inspired you?\nb. Mai: Hi, Linh! Yes, I have. I was very impressed by Marie Curie’s determination.\nc. Linh: I agree. She overcame many difficulties and devoted her life to science.", "opts": ["c – a – b", "a – c – b", "b – a – c", "a – b – c"], "id": "arr2", "answer": 3, "explain": "a đặt câu hỏi về người truyền cảm hứng → b trả lời bằng Marie Curie → c đồng tình và giải thích sự cống hiến. Câu trả lời Yes, I have phải theo sau Have you ever... ."}, {"n": 3, "stem": "Dear Mark,\n\na. Firstly, I admire Uncle Ho because of his extremely simple lifestyle despite being a great leader of our nation.\n\nb. I’m writing this email to tell you about the person I admire the most in Vietnamese history, President Ho Chi Minh.\n\nc. Secondly, his entire life was dedicated to traveling abroad to find a path for national liberation and peace for our people.\n\nd. Besides, his devotion and immense love for children and the elderly continue to inspire millions of Vietnamese youth today.\n\ne. Learning about his life story has truly taught me valuable lessons about perseverance, humility, and patriotism.\nWrite back soon,\nNam", "opts": ["b – c – a – d – e", "b – a – d – c – e", "a – c – b – d – e", "b – a – c – d – e"], "id": "arr3", "answer": 3, "explain": "b giới thiệu người được ngưỡng mộ → a Firstly về lối sống → c Secondly về sự nghiệp → d Besides thêm cống hiến → e rút ra bài học."}, {"n": 4, "stem": "\na. Minh: Absolutely! Sorting waste properly is a simple but effective way to protect the environment.\n\nb. Minh: Have you joined the local green living campaign this weekend? It sounds very practical!\n\nc. Hoa: Yes, I have. Participating in it helped me realize how important waste sorting is.", "opts": ["c – a – b", "b – c – a", "a – c – b", "b – a – c"], "id": "arr4", "answer": 1, "explain": "b hỏi đã tham gia chiến dịch chưa → c trả lời Yes, I have và nêu điều học được → a đồng tình Absolutely rồi nhấn mạnh phân loại rác."}, {"n": 5, "stem": "\na. Lan: Great! Let’s meet at the school gate at eight.\nb. Minh: Yes, I am. What time shall we meet?\nc. Lan: Are you joining the clean-up on Sunday?", "opts": ["a–b–c", "c–b–a", "b–c–a", "c–a–b"], "id": "arr5", "answer": 1, "explain": "c hỏi có tham gia dọn vệ sinh không → b xác nhận và hỏi giờ → a hẹn ở cổng trường lúc tám giờ. Không thể chốt giờ trước khi có lời hỏi."}], "words": ["v89", "v90", "v91", "v92", "v93", "v94"]}, {"id": 16, "cat": "Sắp xếp câu", "title": "Hội thoại và thư • Phần 2", "passage": "Chọn thứ tự hợp lý. Tìm câu mở đầu, câu đáp lời, từ nối và câu kết trước khi đối chiếu các phương án.", "qs": [{"n": 6, "stem": "Dear Mai,\na. In addition, we will plant trees in the school garden.\nb. First, we will collect litter around the school grounds.\nc. I am writing to invite you to our school's Green Living Day this Saturday.\nd. Since both activities will take place outdoors, please bring a hat and a reusable water bottle.\ne. Finally, please let me know by Thursday whether you can join us so that I can register your name.Best wishes,Lan", "opts": ["c–a–b–d–e", "a–d–c–b–e", "c–b–d–a–e", "c–b–a–d–e"], "id": "arr6", "answer": 3, "explain": "c nêu mục đích mời → b First về nhặt rác → a In addition về trồng cây → d nhắc chuẩn bị vì cả hai hoạt động đều ngoài trời → e Finally yêu cầu xác nhận."}, {"n": 7, "stem": "a. John: I think his struggles teach us valuable lessons about determination.\n\nb. John: Have you read the biography of Steve Jobs? It’s very inspiring!\n\nc. Lisa: Yes, I have. His story taught me to never give up on my dreams.", "opts": ["b – c – a", "b – a – c", "a – c – b", "c – a – b"], "id": "arr7", "answer": 0, "explain": "b hỏi về tiểu sử Steve Jobs → c Lisa trả lời Yes, I have → a John rút ra bài học. Bản gốc thiếu nhãn a/b/c; nhãn đã được khôi phục theo thứ tự xuất hiện."}, {"n": 8, "stem": "Hi Gemma,\na. I really enjoyed learning about the different ways people celebrate New Year around the world.\nb. Thank you so much for sending me the video about traditional festivals last week.\nc. Did you know that in Japan, they ring a bell 108 times to welcome the New Year?\nd. The part about the lantern festivals in Thailand was my favourite- it looked so magical!\ne. Let me know about your favourite festival! Write back soon.\nBilly", "opts": ["d– b – a – c– e", "b – d – a – e – c", "b – a – d – c – e", "a – d – b – c – e"], "id": "arr8", "answer": 2, "explain": "b cảm ơn video → a nêu cảm nhận chung về năm mới → d chọn chi tiết lễ hội đèn lồng yêu thích → c bổ sung chi tiết ở Nhật → e mời hồi âm. Theo các lựa chọn, chỉ C vừa mở bằng lời cảm ơn vừa kết bằng e."}, {"n": 9, "stem": "Dear Leonel,\na. We learned a lot about the historical values of the site from a local tour guide. We watched a Chăm performance with dancing and live music.\nb. Yesterday, we visited My Son Sanctuary in Quảng Nam, one of the most historic sites in Vietnam as well as Southeast Asia.\nc. Our visit to My Son was an amazing experience for those who love historical structures. You should visit it if you have a chance.\nd. We rented some traditional Chăm costumes. I looked quite funny in them, but I really enjoyed it.\ne. We arrived at My Son at around 7 a.m., had breakfast and then began exploring the historic temples.\nWrite back soon. Jack", "opts": ["d-b-a-c-e", "b-e-a-d-c", "a-d-b-c-e", "a-c-d-b-e"], "id": "arr9", "answer": 1, "explain": "b giới thiệu chuyến thăm Mỹ Sơn → e thời điểm đến và bắt đầu tham quan → a nghe hướng dẫn, xem biểu diễn → d trải nghiệm trang phục → c đánh giá và khuyên bạn đến. Bản gốc thiếu nhãn; khôi phục theo thứ tự xuất hiện."}, {"n": 10, "stem": "\na. Nam: It's an open booth and it looks huge! Visitors can play Vietnamese traditional games.\n\nb. Linda: They all sound fun. I'll try to join all of them if I can.\n\nc. Linda: Where's the Vietnamese booth?", "opts": ["c-a-b", "a-b-c", "b-a-c", "c-b-a"], "id": "arr10", "answer": 0, "explain": "c Linda hỏi vị trí gian hàng Việt Nam → a Nam chỉ gian hàng và giới thiệu trò chơi → b Linda đáp lại, muốn tham gia. Đại từ them nói đến các trò chơi vừa được giới thiệu."}], "words": ["v95", "v96", "v97", "v98", "v99", "v100"]}], VOCAB=[{"word": "cuisine", "pos": "n.", "meaning": "ẩm thực", "chunk": "Japanese cuisine", "example": "Japanese cuisine reflects local traditions.", "tip": "Cuisine nói về phong cách ẩm thực, không phải một món ăn riêng lẻ.", "id": "v0"}, {"word": "ingredient", "pos": "n.", "meaning": "nguyên liệu", "chunk": "seasonal ingredients", "example": "Fresh ingredients improve the flavour.", "tip": "Phân biệt ingredient (nguyên liệu) và dish (món ăn).", "id": "v1"}, {"word": "identity", "pos": "n.", "meaning": "bản sắc", "chunk": "culinary identity", "example": "Food is part of our cultural identity.", "tip": "Họ từ: identify (v.), identity (n.).", "id": "v2"}, {"word": "authentic", "pos": "adj.", "meaning": "đích thực, đúng bản gốc", "chunk": "an authentic meal", "example": "We enjoyed an authentic Japanese meal.", "tip": "Dùng an trước authentic vì bắt đầu bằng âm nguyên âm.", "id": "v3"}, {"word": "diversity", "pos": "n.", "meaning": "sự đa dạng", "chunk": "cultural diversity", "example": "Our school celebrates cultural diversity.", "tip": "Diverse là tính từ; diversity là danh từ.", "id": "v4"}, {"word": "custom", "pos": "n.", "meaning": "phong tục", "chunk": "dining customs", "example": "Visitors should respect local customs.", "tip": "Customs trong bài là phong tục; ở sân bay còn có nghĩa hải quan.", "id": "v5"}, {"word": "admirable", "pos": "adj.", "meaning": "đáng ngưỡng mộ", "chunk": "admirable individuals", "example": "Her determination is admirable.", "tip": "Admirable là đáng ngưỡng mộ; admiring là đang bày tỏ ngưỡng mộ.", "id": "v6"}, {"word": "achievement", "pos": "n.", "meaning": "thành tựu", "chunk": "scientific achievements", "example": "The prize recognises her achievements.", "tip": "Achieve (v.) → achievement (n.); danh từ đếm được.", "id": "v7"}, {"word": "struggle", "pos": "v./n.", "meaning": "vật lộn, nỗ lực vượt khó", "chunk": "struggle with difficulties", "example": "Many students struggle with new words.", "tip": "Struggle with + khó khăn; struggle to + động từ.", "id": "v8"}, {"word": "determination", "pos": "n.", "meaning": "sự quyết tâm", "chunk": "courage and determination", "example": "Her determ function home(){

function listLessons(){const order=[...LESSONS].sort((a,b)=>['Quảng cáo','Tờ rơi','Sắp xếp câu','Đọc hiểu'].indexOf(a.cat)-['Quảng cáo','Tờ rơi','Sắp xếp câu','Đọc hiểu'].indexOf(b.cat));$('#lessonlist').innerHTML=order.filter(l=>(filter==='all'||l.cat===filter)&&l.title.toLowerCase().includes(search.toLowerCase())).map(l=>{let r=state.results[l.id],draft=state.drafts[l.id];return `<article class="lesson"><div><span class="tag">${l.cat}</span></div><h3>${E(l.title)}</h3><div class="count">${l.qs.length} câu · 6 từ khởi động · ${l.cat==='Đọc hiểu'?'10–12':'6–8'} phút</div><div class="progress"><i style="width:${r?100:0}%"></i></div><div class="small muted">${r?`Lần gần nhất: ${r.correct}/${l.qs.length} đúng · ${fmt(r.at)}`:draft&&Object.keys(draft).length?'Có bài đang làm dở':'Chưa làm bài'}</div><button onclick="prepare(${l.id})">${r?'Luyện lại':draft&&Object.keys(draft).length?'Tiếp tục bài':'Bắt đầu bài'} →</button></article>`}).join('')||'<p>Không tìm thấy bài phù hợp.</p>'}

function prepare(id){const l=LESSONS.find(l=>l.id===id);active=null;let ws=l.words.map(findw);ws.sort((a,b)=>(due(a)?0:!state.words[a.id]?1:2)-(due(b)?0:!state.words[b.id]?1:2));startFlash(ws,()=>startQuiz(id),'6 từ trong bài · '+l.cat)}
