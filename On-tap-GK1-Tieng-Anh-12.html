function quiz(){const l=lesson();const r=state.results[l.id];let good=l.qs.filter(q=>answers[q.id]===q.answer).length;let shown=reviewOnly?l.qs.filter(q=>answers[q.id]!==q.answer):l.qs;
 $('#app').innerHTML=`<div class="actions"><button onclick="nav('home')">← Danh sách bài</button><span class="tag">${l.cat}</span><button onclick="prepare(${l.id})">Ôn lại 6 từ</button></div><h1 style="font-size:30px">${E(l.title)}</h1>${submitted?`<section class="result" aria-live="polite"><div class="scoreline"><div><strong>${good}/${l.qs.length}</strong> câu đúng · Điểm quy đổi <b>${(good/l.qs.length*10).toFixed(1)}/10</b><div>${l.qs.length-Object.keys(answers).length} câu chưa trả lời · ${good===l.qs.length?'Em đã hoàn thành tốt bài này.':'Đọc lời giải, tự nói lại quy tắc rồi luyện lại sau.'}</div></div><button onclick="startQuizFresh()">Làm lại từ đầu</button></div></section><div class="actions"><button onclick="reviewOnly=!reviewOnly;quiz()">${reviewOnly?'Hiện tất cả câu':'Chỉ xem câu sai / bỏ trống'}</button><button onclick="window.print()">In bài & lời giải</button></div>`:'<p class="muted">Đọc kỹ đoạn văn, chọn một phương án cho mỗi câu. Đáp án chỉ mở sau khi nộp bài. Lựa chọn được lưu tự động.</p>'}
 <div class="qnav">${l.qs.map(q=>`<a class="${submitted?(answers[q.id]===q.answer?'done':'bad'):answers[q.id]!==undefined?'done':''}" href="#${q.id}">${q.n}</a>`).join('')}</div><div class="split"><article class="panel passage"><h3>${l.cat==='Sắp xếp câu'?'Gợi ý làm bài':'Đoạn văn'}</h3>${E(l.passage)}</article><section>${shown.map(q=>`<article class="question" id="${q.id}"><div class="eyebrow">Câu ${q.n}</div><p class="stem">${E(q.stem||'Chọn từ hoặc cụm từ điền vào chỗ trống ('+q.n+').')}</p>${q.opts.map((o,i)=>`<label class="option ${submitted?(i===q.answer?'correct':answers[q.id]===i?'wrong':''):''}"><input type="radio" name="${q.id}" value="${i}" ${answers[q.id]===i?'checked':''} ${submitted?'disabled':''} onchange="choose('${q.id}',${i})"><span><b>${'ABCD'[i]}.</b> ${E(o)} ${submitted&&i===q.answer?'<b>✓ Đáp án đúng</b>':''}</span></label>`).join('')}${submitted?`<div class="explanation"><b>${answers[q.id]===undefined?'Chưa trả lời':answers[q.id]===q.answer?'Chính xác':'Cần ôn lại'} · Đáp án ${'ABCD'[q.answer]}</b><div>${E(q.explain)}</div></div>`:''}</article>`).join('')||'<div class="panel">Không có câu sai. Em đã trả lời đúng tất cả!</div>'}</section></div>${!submitted?`<div class="stickybar"><span id="answered">Đã trả lời ${Object.keys(answers).length}/${l.qs.length} câu</span><button class="primary" onclick="submitQuiz()">Nộp bài & xem giải thích</button></div>`:''}${footer()}`;
}
function choose(id,v){answers[id]=v;state.drafts[active]={...answers};save();$('#answered').textContent=`Đã trả lời ${Object.keys(answers).length}/${lesson().qs.length} câu`;document.querySelector(`a[href="#${id}"]`).classList.add('done')}
function startQuizFresh(){state.drafts[active]={};answers={};submitted=false;reviewOnly=false;save();quiz();window.scrollTo(0,0)}
function submitQuiz(){const l=lesson();let missing=l.qs.filter(q=>answers[q.id]===undefined).length;if(missing&&!confirm(`Còn ${missing} câu chưa trả lời. Nộp bài và tính các câu này là chưa đúng?`))return;submitted=true;const r={answers:{...answers},correct:l.qs.filter(q=>answers[q.id]===q.answer).length,total:l.qs.length,at:Date.now(),lid:l.id};state.results[l.id]=r;state.history.unshift(r);state.history=state.history.slice(0,200);save();quiz();window.scrollTo(0,0)}
function wrongQs(){return allq.filter(q=>state.results[q.lid]&&state.results[q.lid].answers[q.id]!==q.answer)}
function mistakes(){const qs=wrongQs();$('#app').innerHTML=`<div class="eyebrow">Học từ lỗi sai</div><h1>Câu cần ôn lại</h1><p class="muted">Dựa trên lần nộp gần nhất của từng bài, gồm câu sai và bỏ trống. Làm lại bài và trả lời đúng để đưa câu ra khỏi danh sách.</p>${qs.map(q=>`<details><summary>${E(LESSONS.find(l=>l.id===q.lid).title)} · Câu ${q.n}</summary><p style="white-space:pre-wrap">${E(q.stem||'Điền chỗ trống '+q.n)}</p><p>Đáp án: <b>${'ABCD'[q.answer]}. ${E(q.opts[q.answer])}</b></p><p>${E(q.explain)}</p><button onclick="prepare(${q.lid})">Luyện lại bài này</button></details>`).join('')||'<div class="panel empty">Chưa có câu cần ôn lại. Hãy làm một bài để biết phần nào em cần củng cố.</div>'}`}
let flashQueue=[],flashIndex=0,flashDone=null,revealed=false,hintShown=false,originFocus=null;
function startFlash(ws,done,label){flashQueue=ws;flashIndex=0;flashDone=done;originFocus=document.activeElement;$('#mlabel').textContent=label;$('#mtitle').textContent='Nhớ trước khi xem';$('#modal').showModal();flashRender()}
function flashRender(){revealed=false;hintShown=false;const w=flashQueue[flashIndex];if(!w){$('#mbody').innerHTML=`<div class="flash"><div class="eyebrow">Hoàn thành lượt ôn</div><h2>Tốt rồi!</h2><p>Em đã tự kiểm tra ${flashQueue.length} từ. Mỗi từ có lịch ôn riêng theo mức nhớ em vừa chọn.</p></div><button class="primary" onclick="finishFlash()">${flashDone?'Vào làm bài →':'Quay về kho từ'}</button>`;return}
 const st=state.words[w.id];$('#mbody').innerHTML=`<div class="scoreline"><span class="small">Thẻ ${flashIndex+1}/${flashQueue.length}</span><span class="tag">${st?due(w)?'Đến hạn ôn':'Ôn củng cố':'Từ mới'}</span></div><div class="progress"><i style="width:${flashIndex/flashQueue.length*100}%"></i></div><div class="flash"><span class="small muted">Nhìn từ và tự nhớ nghĩa tiếng Việt</span><h2>${E(w.word)}</h2><span class="muted">${E(w.pos)}</span><div class="actions" style="justify-content:center"><button onclick="speak('${w.id}')" aria-label="Nghe phát âm ${E(w.word)}">♫ Nghe</button><button onclick="showHint()">Gợi ý ngữ cảnh</button></div><div id="hint" class="hint hidden"></div><div id="cardanswer" class="answer hidden"><h3>${E(w.meaning)}</h3><p class="chunk"><b>${E(w.chunk)}</b></p><p><i>${E(w.example)}</i></p><p class="small">${E(w.tip)}</p></div></div><button class="primary" id="reveal" style="width:100%" onclick="reveal()">Em đã thử nhớ · Lật thẻ</button><div id="ratings" class="hidden"><p class="small muted">Đánh giá theo điều em nhớ <b>trước khi lật</b>. Chưa nhớ thì chọn học lại.</p><div class="ratings"><button onclick="rate(0)">Chưa nhớ<br><span class="small">Ôn sau 10 phút</span></button><button onclick="rate(1)">Nhớ khó / cần gợi ý<br><span class="small">Ôn sau 1 ngày</span></button><button class="primary" onclick="rate(2)">Nhớ rõ<br><span class="small">${nextLabel(w)}</span></button></div></div>${flashDone?'<div class="actions"><button class="quiet small" onclick="skipFlash()">Vào bài ngay, ôn từ sau</button></div>':''}`;
}
const intervals=[1,3,7,14,30];
function nextLabel(w){let s=state.words[w.id];let step=Math.min((s?s.step:-1)+1,4);return 'Ôn sau '+intervals[Math.max(0,step)]+' ngày'}
function showHint(){hintShown=true;const w=flashQueue[flashIndex];$('#hint').textContent=w.example.replace(new RegExp(w.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'_____');$('#hint').classList.remove('hidden')}
function reveal(){revealed=true;$('#cardanswer').classList.remove('hidden');$('#ratings').classList.remove('hidden');$('#reveal').classList.add('hidden')}
function rate(level){if(!revealed)return;if(hintShown&&level===2)level=1;const w=flashQueue[flashIndex],prev=state.words[w.id]||{step:-1,seen:0};let step=level===0?-1:level===1?0:Math.min(prev.step+1,4);let delay=level===0?600000:intervals[step]*DAY;state.words[w.id]={step,seen:prev.seen+1,due:Date.now()+delay,last:Date.now(),rating:level};save();flashIndex++;flashRender()}
function finishFlash(){const done=flashDone;$('#modal').close();if(done)done();else{page='words';active=null;render()}}
function skipFlash(){const done=flashDone;$('#modal').close();if(done)done()}
$('#closemodal').onclick=()=>$('#modal').close();$('#modal').addEventListener('close',()=>{if(originFocus&&document.contains(originFocus))originFocus.focus();if(active===null)render()});
function speak(id){if(!('speechSynthesis' in window))return toast('Trình duyệt này không hỗ trợ giọng đọc.');const u=new SpeechSynthesisUtterance(findw(id).word);u.lang='en-GB';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}
function daily(){const ws=VOCAB.filter(due).sort((a,b)=>state.words[a.id].due-state.words[b.id].due).slice(0,12);if(!ws.length){const fresh=VOCAB.filter(w=>!state.words[w.id]).slice(0,6);if(fresh.length)return startFlash(fresh,null,'Học 6 từ mới');return toast('Chưa có từ đến hạn. Em có thể chọn một bài hoặc ôn bất kỳ từ trong kho.')}startFlash(ws,null,'Ôn từ đến hạn · tối đa 12 thẻ mỗi lượt')}
function words(){page='words';$('#app').innerHTML=`<div class="eyebrow">Nhớ từ trong ngữ cảnh</div><h1>Kho từ vựng</h1><p class="muted">${VOCAB.length} từ và cụm từ: nghĩa, từ loại, cách kết hợp, ví dụ và lỗi dễ nhầm. Lật thẻ rồi tự đánh giá để đặt lịch ôn. Giọng đọc tùy thiết bị; nội dung học dùng được ngoại tuyến.</p><div class="actions"><button class="primary" onclick="daily()">Ôn từ đến hạn (${VOCAB.filter(due).length})</button><button onclick="startFlash([...VOCAB].sort(()=>Math.random()-.5).slice(0,8),null,'Ôn ngẫu nhiên 8 từ')">Ôn ngẫu nhiên 8 từ</button></div><div class="toolbar"><input id="vsearch" aria-label="Tìm từ vựng" placeholder="Tìm từ tiếng Anh hoặc nghĩa tiếng Việt"><select id="vfilter" aria-label="Lọc trạng thái từ"><option value="all">Tất cả từ</option><option value="due">Đến hạn ôn</option><option value="new">Chưa học</option><option value="learned">Đã học</option></select></div><div id="vlist" class="vocabgrid"></div>`;$('#vsearch').oninput=wordlist;$('#vfilter').onchange=wordlist;wordlist()}
function wordlist(){const s=$('#vsearch').value.toLowerCase(),f=$('#vfilter').value;$('#vlist').innerHTML=VOCAB.filter(w=>(w.word+' '+w.meaning).toLowerCase().includes(s)&&(f==='all'||f==='due'&&due(w)||f==='new'&&!state.words[w.id]||f==='learned'&&state.words[w.id])).map(w=>`<article class="word"><div class="scoreline"><strong>${E(w.word)} <span class="small muted">${E(w.pos)}</span></strong><button onclick="speak('${w.id}')" aria-label="Nghe ${E(w.word)}">♫</button></div><div>${E(w.meaning)}</div><p class="chunk">${E(w.chunk)}</p><p><i>${E(w.example)}</i></p><p class="small muted">${E(w.tip)}</p><div class="small">${state.words[w.id]?`Lần ôn tiếp: ${fmt(state.words[w.id].due)} ${due(w)?'· Đã đến hạn':''}`:'Chưa tự kiểm tra'}</div><button class="small" onclick="startFlash([findw('${w.id}')],null,'Tự kiểm tra một từ')">Tự kiểm tra</button></article>`).join('')||'<div class="panel">Không có từ phù hợp bộ lọc.</div>'}
function guide(){$('#app').innerHTML=`<div class="eyebrow">Học chủ động</div><h1>Ôn cách quãng, nhớ bằng cách tự gọi lại.</h1><div class="panel"><h2>Cách học với trang này</h2><p>Trước mỗi bài, cửa sổ khởi động chọn <b>6 từ có trong chính bài đó</b>, ưu tiên từ đến hạn rồi tới từ chưa học. Đọc từ tiếng Anh và tự nói nghĩa, cụm từ hoặc một câu ví dụ trước khi lật thẻ.</p><p><b>Chưa nhớ:</b> ôn sau 10 phút. <b>Nhớ khó hoặc cần gợi ý:</b> ôn sau 1 ngày. <b>Nhớ rõ:</b> lịch tăng lần lượt 1 → 3 → 7 → 14 → 30 ngày; những lần sau giữ 30 ngày. Nếu quên, chu kỳ của từ đó bắt đầu lại. Dùng gợi ý thì lần đó được tính tối đa là “Nhớ khó”.</p><p class="muted">Đây là lịch ôn đơn giản dựa trên tự đánh giá, không phải phép đo trí nhớ. Ôn đúng hạn và thử nhớ trước khi xem đáp án giúp việc học chủ động hơn. Trang không gửi thông báo nền: em cần mở lại và bấm “Ôn từ đến hạn”.</p><p>Làm một bài ngắn mỗi ngày. Sau khi nộp, đọc lời giải cả những câu đoán đúng; ghi một ví dụ của riêng em. Ngày tiếp theo, ôn từ đến hạn trước rồi quay lại câu sai.</p></div>${[
['Mạo từ: a / an / the','Dùng a/an trước danh từ đếm được số ít chưa xác định; chọn theo âm: an authentic meal, an exciting workshop, a reusable bag. The đi với đối tượng được xác định: the world, the heart of Vietnam.'],
['Dạng từ và cấu trúc song song','Admirable individuals (adj. + n.); encourage understanding (v. + n.); quality, diversity and cultural significance (ba danh từ); tasty and healthy (hai tính từ). Học cả họ từ: diverse → diversity; sustain → sustainable → sustainability.'],
['Trật tự từ trong cụm danh từ','Mạo từ → tính từ đánh giá/kích thước → đặc điểm/phân loại → danh từ chính. Ví dụ: impressive scientific achievements; a small local farming community; memorable dining experiences.'],
['Mệnh đề quan hệ rút gọn','Chủ động dùng V-ing: guests taking part = guests who take part. Bị động dùng V3: cuisine known as = cuisine which is known as; programmes praised = programmes which are praised. Sau dấu phẩy, mệnh đề không xác định chỉ người dùng who, không dùng that.'],
['Cụm từ cố định và giới từ + V-ing','Make a contribution to protecting; make an effort to sort; make a difference to; raise awareness of. Instead of, in addition to, because of, in spite of theo sau bằng danh từ hoặc V-ing. To trong contribution to là giới từ, nhưng to trong effort to sort mở đầu động từ nguyên mẫu.'],
['Other / another / others / every','Other + danh từ số nhiều/không đếm được: other ways. Another + danh từ số ít: another way. Others là đại từ, không đi trực tiếp trước danh từ. Every + danh từ số ít: every small action counts. A few + số nhiều; a little + không đếm được.'],
['Đọc hiểu: chi tiết, phủ định, đại từ, ý chính','Gạch từ khóa và xác định đoạn chứa bằng chứng. Với NOT mentioned, loại từng phương án thực sự có trong bài. Với it/they/them, tìm danh từ phù hợp về nghĩa và số. Ý chính cần bao quát đoạn, tránh lựa chọn thêm always/only hoặc chi tiết không được nêu.'],
['Sắp xếp câu và các thì kể chuyện','Tìm câu giới thiệu → hỏi/đáp → First/Secondly/In addition → kết luận. Yes, I have đáp lại Have you...? Hai hành động đang diễn ra song song: While + quá khứ tiếp diễn, quá khứ tiếp diễn. Hành động đang diễn ra bị xen vào: While + quá khứ tiếp diễn, quá khứ đơn.']
].map(([t,b])=>`<details><summary>${t}</summary><p>${b}</p></details>`).join('')}`}
function writing(){$('#app').innerHTML=`<div class="eyebrow">Phần bổ sung từ tài liệu gốc</div><h1>Luyện viết & biến đổi câu</h1><p class="muted">22 câu viết lại và 2 đề đoạn văn. Tự viết trước rồi mở mẫu đối chiếu. Phần này không chấm điểm tự động vì có thể có nhiều cách viết đúng.</p><section class="writing">${WRITING.map((w,i)=>`<details><summary>Câu ${i+1} · ${E(w[0])}</summary><p>${E(w[1])}</p><textarea aria-label="Bài làm câu ${i+1}" oninput="state.writing['w${i}']=this.value;save()" placeholder="Viết câu trả lời của em…">${E(state.writing['w'+i]||'')}</textarea><details><summary>Xem câu gợi ý & quy tắc</summary><p><b>${E(w[2])}</b></p><p>${E(w[3])}</p></details></details>`).join('')}<details><summary>Đoạn văn 1 · A person you admire · 120–150 từ</summary><p>Giới thiệu người em ngưỡng mộ → 2 phẩm chất hoặc thành tựu kèm ví dụ → ảnh hưởng của người đó với em. Dùng admire ... for, devote ... to, determination, perseverance. Tránh liệt kê tiểu sử mà không giải thích lý do ngưỡng mộ.</p>${paragraphBox('person')}</details><details><summary>Đoạn văn 2 · An eco-friendly city/place you want to live in · 120–150 từ</summary><p>Giới thiệu nơi muốn sống → 2–3 đặc điểm như giao thông công cộng, không gian xanh, phân loại rác → lợi ích và việc em sẽ làm. Dùng sustainable, reusable, reduce emissions, conserve resources. Nêu rõ vì sao em muốn sống ở đó.</p>${paragraphBox('city')}</details><div class="panel"><b>Tự rà soát đoạn văn:</b> Đủ 120–150 từ? Có câu chủ đề và câu kết? Mỗi ý có ví dụ? Thì và chủ–vị nhất quán? Từ nối tự nhiên? Đúng mạo từ, chính tả và dấu câu?</div></section>`}
function paragraphBox(id){const val=state.writing[id]||'';return `<textarea aria-label="Viết đoạn văn ${id}" oninput="state.writing['${id}']=this.value;save();document.getElementById('wc${id}').textContent=countWords(this.value)" placeholder="Viết đoạn văn của em…">${E(val)}</textarea><p class="small muted">Số từ: <span id="wc${id}">${countWords(val)}</span> / 120–150</p>`}
function countWords(s){return s.trim()?s.trim().split(/\s+/).length:0}
function settings(){$('#app').innerHTML=`<div class="eyebrow">Dữ liệu của em</div><h1>Tiến độ & ghi chú</h1><div class="panel"><h2>Lưu và chuyển tiến độ</h2><p>Lựa chọn, kết quả, bài viết và lịch ôn từ được lưu trong trình duyệt này. Đổi trình duyệt, đổi thiết bị, di chuyển file hoặc dùng chế độ riêng tư có thể khiến tiến độ không còn xuất hiện. Hãy xuất bản sao để tiếp tục ở nơi khác.</p><div class="actions"><button class="primary" onclick="exportData()">Xuất tiến độ (.json)</button><label><span class="small">Nhập bản sao tiến độ: </span><input type="file" accept="application/json,.json" id="importfile"></label><button class="danger" onclick="resetData()">Xóa tiến độ trên thiết bị</button></div><p class="small muted">Nhập tiến độ sẽ thay thế dữ liệu hiện tại sau khi em xác nhận. File HTML chứa sẵn đáp án để dùng ngoại tuyến, phù hợp tự học.</p></div><h2 style="margin-top:26px">Lịch sử nộp bài</h2>${state.history.slice(0,20).map(r=>`<p class="panel small">${fmt(r.at)} · ${E(LESSONS.find(l=>l.id===r.lid)?.title||'Bài luyện')} · <b>${r.correct}/${r.total} đúng</b></p>`).join('')||'<p class="muted">Chưa có lần nộp bài nào.</p>'}<details><summary>Hiệu đính và phạm vi nội dung</summary><p>Giữ đủ 84 câu trắc nghiệm từ tài liệu: 25 câu quảng cáo, 25 câu tờ rơi, 10 câu sắp xếp và 24 câu đọc hiểu. Bài Environmental Protection trong bản gốc chỉ có câu 21–24; không tự thêm câu 25.</p><ul><li>Life Stories, câu 12: thay phương án D “who was invented” bằng “who invented”; câu gốc không có phương án hoàn chỉnh đúng cho mệnh đề sau dấu phẩy. Thêm while ở chỗ trống 11 để ngữ pháp rõ ràng.</li><li>Travel Green, câu 14: sửa distance → distances; sửa puplic → public.</li><li>Go Green – Start with Yourself, câu 17: sửa đáp án tô trong nguồn từ B (others) thành C (every): every small action counts.</li><li>Phần sắp xếp câu 7–9: thêm nhãn a–e theo đúng thứ tự câu xuất hiện. Câu 1 có phương án A/B trùng nhau trong nguồn; giữ nguyên hai phương án sai này.</li><li>Vietnamese Cuisine: đánh số (13) cho chỗ trống cuối; sửa which make → which makes để hòa hợp với mệnh đề trước đó.</li><li>Recycle Today: sửa Rise out → Rinse out, out the rubbish bin → out of the rubbish bin. Importance of Recycling: some others materials → some other materials.</li><li>Chuẩn hóa nhãn A bị thiếu ở câu 25 bài Green Living; sửa “he word” → “The word” ở bài Plastic Footprint và chuẩn hóa khoảng trắng.</li></ul><p>Những câu không có đáp án được đánh dấu rõ trong tài liệu được giải dựa trên ngữ pháp, ngữ cảnh hoặc bằng chứng trong đoạn. Lời giải, từ vựng và câu mẫu viết là phần biên soạn thêm; mẫu viết không phải cách diễn đạt duy nhất.</p></details>`;$('#importfile').onchange=importData}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tien-do-tieng-anh-12.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function validData(s){if(!s||s.version!==1)return false;const obj=x=>x&&typeof x==='object'&&!Array.isArray(x);if(!obj(s.words)||!obj(s.results)||!obj(s.drafts)||!obj(s.writing)||!Array.isArray(s.history))return false;const validAnswers=a=>obj(a)&&Object.entries(a).every(([k,v])=>allq.some(q=>q.id===k)&&Number.isInteger(v)&&v>=0&&v<=3);return Object.entries(s.words).every(([k,w])=>findw(k)&&obj(w)&&Number.isFinite(w.due)&&Number.isFinite(w.last)&&Number.isInteger(w.seen)&&w.seen>=0&&Number.isInteger(w.step)&&w.step>=-1&&w.step<=4)&&Object.entries(s.drafts).every(([k,v])=>LESSONS.some(l=>l.id===+k)&&validAnswers(v))&&Object.entries(s.results).every(([k,r])=>LESSONS.some(l=>l.id===+k)&&obj(r)&&validAnswers(r.answers)&&Number.isFinite(r.at)&&Number.isFinite(r.correct))&&s.history.length<=200&&s.history.every(r=>obj(r)&&LESSONS.some(l=>l.id===r.lid)&&Number.isFinite(r.at)&&Number.isFinite(r.correct)&&Number.isFinite(r.total)&&validAnswers(r.answers))&&Object.values(s.writing).every(v=>typeof v==='string'&&v.length<100000)}
async function importData(e){const f=e.target.files[0];if(!f)return;try{if(f.size>3000000)throw Error();let s=JSON.parse(await f.text());if(!validData(s))throw Error();if(!confirm('Thay thế tiến độ hiện tại bằng bản sao đã chọn?'))return;state=s;save();settings();toast('Đã nhập tiến độ.')}catch(e){toast('Bản sao không hợp lệ. Hãy chọn file JSON được xuất từ trang này.')}}
function resetData(){if(confirm('Xóa toàn bộ kết quả, lịch ôn và bài viết trên trình duyệt này? Hãy xuất bản sao nếu muốn giữ lại.')){state=empty();save();render();toast('Đã xóa tiến độ.')}}
render();
</script></body></html>
